databases:
  - name: talktome-db
    plan: free
    databaseName: talktome
    user: talktome
    postgresMajorVersion: "16"

services:
  - type: web
    name: conversation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: talktome-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: anthropic/claude-3.5-haiku
      - key: EMOTION_SERVICE_URL
        value: http://127.0.0.1:8001
      - key: ATE_SERVICE_URL
        value: http://127.0.0.1:8002
      - key: CRISIS_SERVICE_URL
        value: http://127.0.0.1:8003
      - key: FILTER_SERVICE_URL
        value: http://127.0.0.1:8004
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: talktome-redis
          property: connectionString

  - type: keyvalue
    name: talktome-redis
    plan: free
    ipAllowList: []
